<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">

<head>
    <title>Cursos</title>
</head>

<body>
<section layout:fragment="content">

    <h1>Cursos</h1>

    <a class="btn btn-secondary mb-3"
       th:href="@{/}">
        Volver
    </a>

    <a class="btn btn-success mb-3"
       th:href="@{/cursos/nuevo}"
       sec:authorize="hasRole('ADMIN')">
        Nuevo curso
    </a>

    <button class="btn btn-outline-secondary mb-3"
            disabled
            title="Solo disponible para administradores"
            sec:authorize="hasRole('USER')">
        Nuevo curso
    </button>

    <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Estudiantes</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="curso : ${cursos}">
            <td th:text="${curso.id}"></td>
            <td th:text="${curso.nombre}"></td>
            <td>
                <span th:if="${#lists.isEmpty(curso.estudiantes)}">
                    Sin estudiantes inscritos
                </span>

                <ul th:if="${not #lists.isEmpty(curso.estudiantes)}" class="mb-0">
                    <li th:each="e : ${curso.estudiantes}">
                        <span th:text="${e.nombre}"></span>
                        -
                        <span th:text="${e.email}"></span>
                    </li>
                </ul>
            </td>
            <td>
                <div class="d-flex flex-wrap gap-2">

                    <a class="btn btn-sm btn-warning"
                       th:href="@{/cursos/editar/{id}(id=${curso.id})}"
                       sec:authorize="hasRole('ADMIN')">
                        Editar
                    </a>

                    <button class="btn btn-sm btn-outline-secondary"
                            disabled
                            title="Solo disponible para administradores"
                            sec:authorize="hasRole('USER')">
                        Editar
                    </button>

                    <a class="btn btn-sm btn-info"
                       th:href="@{/cursos/{id}/inscribir(id=${curso.id})}"
                       sec:authorize="hasRole('ADMIN')">
                        Inscribir
                    </a>

                    <button class="btn btn-sm btn-outline-secondary"
                            disabled
                            title="Solo disponible para administradores"
                            sec:authorize="hasRole('USER')">
                        Inscribir
                    </button>

                    <form th:action="@{/cursos/eliminar/{id}(id=${curso.id})}"
                          method="post"
                          style="display:inline"
                          sec:authorize="hasRole('ADMIN')">
                        <button class="btn btn-sm btn-danger" type="submit">
                            Eliminar
                        </button>
                    </form>

                    <button class="btn btn-sm btn-outline-secondary"
                            disabled
                            title="Solo disponible para administradores"
                            sec:authorize="hasRole('USER')">
                        Eliminar
                    </button>

                </div>
            </td>
        </tr>
        </tbody>
    </table>

</section>
</body>
</html>
