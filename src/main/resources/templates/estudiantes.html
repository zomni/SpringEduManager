<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">

<head>
    <title>Estudiantes</title>
</head>

<body>
<section layout:fragment="content">

    <h1>Estudiantes</h1>

    <a class="btn btn-secondary mb-3"
       th:href="@{/}">
        Volver
    </a>

    <a class="btn btn-success mb-3"
       th:href="@{/estudiantes/nuevo}"
       sec:authorize="hasRole('ADMIN')">
        Nuevo estudiante
    </a>

    <button class="btn btn-outline-secondary mb-3"
            disabled
            title="Solo disponible para administradores"
            sec:authorize="hasRole('USER')">
        Nuevo estudiante
    </button>

    <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="e : ${estudiantes}">
            <td th:text="${e.id}"></td>
            <td th:text="${e.nombre}"></td>
            <td th:text="${e.email}"></td>
            <td>
                <div class="d-flex flex-wrap gap-2">

                    <a class="btn btn-sm btn-warning"
                       th:href="@{/estudiantes/editar/{id}(id=${e.id})}"
                       sec:authorize="hasRole('ADMIN')">
                        Editar
                    </a>

                    <button class="btn btn-sm btn-outline-secondary"
                            disabled
                            title="Solo disponible para administradores"
                            sec:authorize="hasRole('USER')">
                        Editar
                    </button>

                    <form th:action="@{/estudiantes/eliminar/{id}(id=${e.id})}"
                          method="post"
                          style="display:inline"
                          sec:authorize="hasRole('ADMIN')">
                        <button class="btn btn-sm btn-danger" type="submit">
                            Eliminar
                        </button>
                    </form>

                    <button class="btn btn-sm btn-outline-secondary"
                            disabled
                            title="Solo disponible para administradores"
                            sec:authorize="hasRole('USER')">
                        Eliminar
                    </button>

                </div>
            </td>
        </tr>
        </tbody>
    </table>

</section>
</body>
</html>
