<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inscribir estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h1 class="mb-3" th:text="'Curso: ' + ${curso.nombre}">Curso</h1>

<p class="alert alert-info">
    Usuario conectado:
    <strong th:text="${usuario}">admin</strong>
</p>

<div class="card">
    <div class="card-body">
        <h2 class="h4 mb-3">Seleccionar estudiante</h2>

        <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center"
                th:each="e : ${estudiantes}">
                <div>
                    <strong th:text="${e.nombre}">Nombre</strong>
                    <span class="text-muted"> - </span>
                    <span th:text="${e.email}">correo@mail.com</span>
                </div>

                <form th:action="@{/cursos/{cursoId}/inscribir/{estudianteId}(cursoId=${curso.id}, estudianteId=${e.id})}"
                      method="post"
                      style="margin:0;">
                    <button class="btn btn-primary btn-sm" type="submit">
                        Inscribir
                    </button>
                </form>
            </li>
        </ul>
    </div>
</div>

<br>

<a class="btn btn-secondary" th:href="@{/cursos}">Volver</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
